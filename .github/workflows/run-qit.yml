name: Run QIT

on:
  workflow_call:
    inputs:
      extension:
        required: true
        type: string
      artifact:
        type: string
        required: true
      wp-version:
        type: string
        default: 'stable'
      wc-version:
        type: string
        default: 'stable'
      php-version:
        type: string
        default: '8.4'
      # Customize which QIT test types to run.
      test-activation:
        type: string
        default: 'false'
      test-security:
        type: string
        default: 'false'
      test-phpcompatibility:
        type: string
        default: 'false'
      test-phpstan:
        type: string
        default: 'false'
      test-woo-api:
        type: string
        default: 'false'
      test-woo-e2e:
        type: string
        default: 'false'
      test-e2e:
        type: string
        default: 'false'
      test-additional-plugins:
        type: string
        default: ''
      test-malware:
        type: string
        default: 'false'
      test-plugin-check:
        type: string
        default: 'false'
      test-validation:
        type: string
        default: 'false'
      options:
        type: string
        default: ''
      # End of QIT tests.
      wait:
        type: boolean
        default: true

env:
  NO_COLOR: 1
  QIT_DISABLE_ONBOARDING: yes
  EXTENSION_SLUG: ${{ inputs.extension }}
  WP_VERSION: ${{ inputs.wp-version && inputs.wp-version || 'stable' }}
  WC_VERSION: ${{ inputs.wc-version && inputs.wc-version || 'stable' }}
  PHP_VERSION: ${{ inputs.php-version && inputs.php-version || '8.4' }}
  # QIT names the WordPress/WooCommerce release candidates 'rc', not 'nightly'.
  WP_VERSION_ARG: ${{ inputs.wp-version == 'nightly' && 'rc' || ( inputs.wp-version && inputs.wp-version || 'stable' ) }}
  WC_VERSION_ARG: ${{ inputs.wc-version == 'nightly' && 'rc' || ( inputs.wc-version && inputs.wc-version || 'stable' ) }}
  ADDITIONAL_PLUGINS: ${{ inputs.test-additional-plugins && format( '--additional_plugins={0}', inputs.test-additional-plugins ) || '' }}
  WAIT_FLAG: ${{ inputs.wait && '--wait' || '' }}
  EXTRA_OPTIONS: ${{ inputs.options }}

jobs:

  qit-tests:

        name: Run QIT Tests
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:

          - name: Install QIT via composer
            shell: bash
            run: composer require 'woocommerce/qit-cli:^1.3'

          - name: Add Partner and Prepare Environment
            id: prepare-environment
            shell: bash
            env:
              PARTNER_USER: ${{ secrets.QIT_PARTNER_USER }}
              PARTNER_SECRET: ${{ secrets.QIT_PARTNER_SECRET }}
            run: |

              # Add Partner.
              ./vendor/bin/qit partner:add \
                --user="$PARTNER_USER" \
                --qit_token="$PARTNER_SECRET"

              # Export ZIP file path to GITHUB_ENV.
              echo "ZIP_FILE_PATH=${{ github.workspace }}/$EXTENSION_SLUG.zip" >> $GITHUB_ENV

              # Create a directory to store QIT Results.
              mkdir ${{ github.workspace }}/qit-results

          - name: Download the zip
            id: download-zip
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
                name: ${{ inputs.artifact }}
                path: ${{ github.workspace }}

          ##############################
          # Activation Tests.
          ##############################

          - name: Activation test
            id: run-activation-test
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-activation == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              echo "Running activation test for ${{ env.EXTENSION_SLUG }}"
              ./vendor/bin/qit run:activation \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                --wp=${{ env.WP_VERSION_ARG }} \
                --woo=${{ env.WC_VERSION_ARG }} \
                --php_version=${{ env.PHP_VERSION }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-activation-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo activation results
            if: ${{ !cancelled() && inputs.test-activation == 'true' && steps.run-activation-test.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-activation-results.txt
              exit ${{ steps.run-activation-test.outputs.exitcode || '1' }}

          ##############################
          # Security Tests.
          ##############################

          - name: Run security test
            id: run-security-test
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-security == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:security \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-security-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo security results
            if: ${{ !cancelled() && inputs.test-security == 'true' && steps.run-security-test.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-security-results.txt
              exit ${{ steps.run-security-test.outputs.exitcode || '1' }}

          ##############################
          # PHP Compatibility Tests.
          ##############################

          - name: Run PHP compatibility test
            id: run-php-compatibility-test
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-phpcompatibility == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:phpcompatibility \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-php-compatibility-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo PHP compatibility results
            if: ${{ !cancelled() && inputs.test-phpcompatibility == 'true' && steps.run-php-compatibility-test.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-php-compatibility-results.txt
              exit ${{ steps.run-php-compatibility-test.outputs.exitcode || '1' }}

          ##############################
          # PHPStan Tests.
          ##############################
          - name: Run PHPStan Tests
            id: run-phpstan-tests
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-phpstan == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:phpstan \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                --wordpress_version=${{ env.WP_VERSION_ARG }}  \
                --woocommerce_version=${{ env.WC_VERSION_ARG }}  \
                ${{ env.ADDITIONAL_PLUGINS }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-phpstan-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo PHPStan results
            if: ${{ !cancelled() && inputs.test-phpstan == 'true' && steps.run-phpstan-tests.outputs.exitcode != '' }}
            run: |

              cat -v ${{ github.workspace }}/qit-results/qit-phpstan-results.txt
              exit ${{ steps.run-phpstan-tests.outputs.exitcode || '1' }}

          ##############################
          # Malware Tests.
          ##############################
          - name: Run Malware Tests
            id: run-malware-tests
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-malware == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:malware \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-malware-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo Malware results
            if: ${{ !cancelled() && inputs.test-malware == 'true' && steps.run-malware-tests.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-malware-results.txt
              exit ${{ steps.run-malware-tests.outputs.exitcode || '1' }}

          ##############################
          # Plugin Check Tests (for dotOrg).
          ##############################
          - name: Run Plugin Check Tests
            id: run-plugin-check-tests
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-plugin-check == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:plugin-check \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-plugin-check-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo Plugin Check results
            if: ${{ !cancelled() && inputs.test-plugin-check == 'true' && steps.run-plugin-check-tests.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-plugin-check-results.txt
              exit ${{ steps.run-plugin-check-tests.outputs.exitcode || '1' }}

          ##############################
          # Validation Tests.
          ##############################
          - name: Run Validation Tests
            id: run-validation-tests
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-validation == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:validation \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                --php_version=${{ env.PHP_VERSION }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-validation-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo Validation results
            if: ${{ !cancelled() && inputs.test-validation == 'true' && steps.run-validation-tests.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-validation-results.txt
              exit ${{ steps.run-validation-tests.outputs.exitcode || '1' }}

          ##############################
          # WC API Tests.
          ##############################
          - name: Run WC API Tests
            id: run-woo-api-tests
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-woo-api == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:woo-api \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                --wordpress_version=${{ env.WP_VERSION_ARG }} \
                --woocommerce_version=${{ env.WC_VERSION_ARG }} \
                --php_version=${{ env.PHP_VERSION }} \
                ${{ env.ADDITIONAL_PLUGINS }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-woo-api-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          - name: Echo WC API results
            if: ${{ !cancelled() && inputs.test-woo-api == 'true' && steps.run-woo-api-tests.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-woo-api-results.txt
              exit ${{ steps.run-woo-api-tests.outputs.exitcode || '1' }}

          ##############################
          # WC E2E Tests.
          ##############################
          - name: Run WC E2E Tests
            id: run-woo-e2e-tests
            if: ${{ !cancelled() && steps.prepare-environment.outcome == 'success' && steps.download-zip.outcome == 'success' && inputs.test-woo-e2e == 'true' }}
            # Do not fail when the `qit` fails, so we can annotate the results.
            shell: bash --noprofile --norc {0}
            run: |
              ./vendor/bin/qit run:woo-e2e \
                ${{ env.EXTENSION_SLUG }} \
                --zip=${{ env.ZIP_FILE_PATH }} \
                --wordpress_version=${{ env.WP_VERSION_ARG }} \
                --woocommerce_version=${{ env.WC_VERSION_ARG }} \
                --php_version=${{ env.PHP_VERSION }} \
                ${{ env.ADDITIONAL_PLUGINS }} \
                ${{ env.WAIT_FLAG }} \
                ${{ env.EXTRA_OPTIONS }} \
                -n \
                > ${{ github.workspace }}/qit-results/qit-woo-e2e-results.txt
              echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
              # A WooCommerce version without its own core E2E package (e.g. a beta) runs a
              # mismatched package; flag it so its result is reported, not failed.
              if grep -q 'No test package covers WooCommerce' ${{ github.workspace }}/qit-results/qit-woo-e2e-results.txt; then
                echo "nopackage=true" >> "$GITHUB_OUTPUT"
              fi

          - name: Echo WC E2E results
            if: ${{ !cancelled() && inputs.test-woo-e2e == 'true' && steps.run-woo-e2e-tests.outputs.exitcode != '' }}
            run: |
              cat -v ${{ github.workspace }}/qit-results/qit-woo-e2e-results.txt
              if [ "${{ steps.run-woo-e2e-tests.outputs.nopackage }}" = 'true' ]; then
                echo "::warning title=QIT Woo E2E not verified::$(grep -m1 'No test package covers WooCommerce' ${{ github.workspace }}/qit-results/qit-woo-e2e-results.txt)"
                exit 0
              fi
              exit ${{ steps.run-woo-e2e-tests.outputs.exitcode || '1' }}

          - name: Summarize QIT results
            if: ${{ always() }}
            env:
              QIT_INPUTS: ${{ toJSON(inputs) }}
              QIT_STEPS: ${{ toJSON(steps) }}
            run: |
              python3 - <<'PYTHON'
              import json
              import os

              inputs = json.loads(os.environ['QIT_INPUTS'])
              steps = json.loads(os.environ['QIT_STEPS'])
              checks = {
                  'activation': 'run-activation-test',
                  'security': 'run-security-test',
                  'phpcompatibility': 'run-php-compatibility-test',
                  'phpstan': 'run-phpstan-tests',
                  'malware': 'run-malware-tests',
                  'plugin-check': 'run-plugin-check-tests',
                  'validation': 'run-validation-tests',
                  'woo-api': 'run-woo-api-tests',
                  'woo-e2e': 'run-woo-e2e-tests',
              }
              failed = False
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('| QIT check | Result |\n| --- | --- |\n')
                  for check, step in checks.items():
                      code = steps.get(step, {}).get('outputs', {}).get('exitcode', '')
                      if inputs['test-' + check] != 'true':
                          result = 'unrequested'
                      elif code == '':
                          result = 'blocked'
                          failed = True
                      elif steps.get(step, {}).get('outputs', {}).get('nopackage') == 'true':
                          result = 'not verified: no matching test package (exit ' + code + ')'
                      elif code == '0':
                          result = 'passed'
                      else:
                          result = 'failed (exit ' + code + ')'
                          failed = True
                      summary.write('| ' + check + ' | ' + result + ' |\n')
              raise SystemExit(1 if failed else 0)
              PYTHON

          - name: Upload results
            if: always()
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
                name: qit-results
                path: ${{ github.workspace }}/qit-results/