# Temporary validation branch; do not merge.
name: Ubuntu 26.04 validation
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ubuntu-26-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    name: Setup environments
    uses: ./.github/workflows/setup-env.yml
  php-lint:
    name: PHP
    uses: ./.github/workflows/php-cs-on-changes.yml
    needs:
      - setup
  js-lint:
    name: JS Linting
    uses: ./.github/workflows/js-css-linting.yml
    needs:
      - setup
  php-tests:
    name: PHP
    uses: ./.github/workflows/php-unit-tests.yml
    needs:
      - setup
  js-tests:
    name: JavaScript
    uses: ./.github/workflows/js-unit-tests.yml
    needs:
      - setup
  build_project:
    name: Package
    uses: ./.github/workflows/build-upload-zip.yml
    needs:
      - setup
  e2e-tests:
    name: E2E tests
    uses: ./.github/workflows/run-e2e.yml
    with:
      wc-version: latest
      wp-version: latest
      php-version: "8.4"
    needs:
      - build_project
  extra-phpstan:
    name: PHPStan
    uses: ./.github/workflows/phpstan.yml
    needs:
      - setup
  extra-plugin-check:
    name: WordPress Plugin Checks
    uses: ./.github/workflows/plugin-check.yml
    needs:
      - setup
  extra-production-zip:
    name: Production package
    uses: ./.github/workflows/production-zip.yml
    needs:
      - setup
  extra-spell-check:
    name: Spell Check
    uses: ./.github/workflows/spell-check.yml
    needs:
      - setup
