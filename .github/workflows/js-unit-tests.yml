name: JavaScript Unit Tests

on:
  push:
    branches:
      - trunk
    paths:
      - "**.js"
      - vitest.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/js-unit-tests.yml
  workflow_call:

jobs:
  UnitTests:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_COLOR: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@b9c1e59aae9fdbe668b068ebd59c1545a88ea9fa # actions-v3.0.5
        with:
          node-version-file: ".nvmrc"

      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Upload coverage report
        if: always() && hashFiles('coverage/clover.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: coverage/
          retention-days: 90

      - name: Coverage summary
        if: always() && hashFiles('coverage/clover.xml') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage/clover.xml').getroot().find('project/metrics')
          s, c = int(m.get('statements')), int(m.get('coveredstatements'))
          print(f"JS line coverage: {c}/{s} ({100 * c / s:.1f}%)" if s else "JS line coverage: no statements")
          PY
