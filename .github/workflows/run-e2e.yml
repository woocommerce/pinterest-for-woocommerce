name: Run E2E Tests

on:
  workflow_call:
    inputs:
      wp-version:
        description: 'WordPress version: `latest` (default), `nightly` or a specific version.'
        type: string
        default: 'latest'
      wc-version:
        description: 'WooCommerce version: `latest` (default), `nightly` or a specific version.'
        type: string
        default: 'latest'
      php-version:
        description: 'PHP version of the test store.'
        type: string
        default: '8.4'

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node version and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # Builds the plugin, starts wp-env and installs the test-only MU plugin
      # that answers Pinterest API requests locally, so no secrets are needed.
      - name: Set up the browser test store
        env:
          E2E_WP_VERSION: ${{ inputs.wp-version }}
          E2E_WC_VERSION: ${{ inputs.wc-version }}
          E2E_PHP_VERSION: ${{ inputs.php-version }}
        run: npm run test:browser:setup

      - name: Run E2E tests
        run: npm run test:browser

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: browser-test-results
          path: test-results/browser
          retention-days: 2
