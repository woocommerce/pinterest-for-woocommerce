name: Run E2E Tests

on:
  workflow_call:
    inputs:
      wp-version:
        description: 'WordPress version: `latest` (default), `nightly` or a specific version.'
        type: string
        default: 'latest'
      wc-version:
        description: 'WooCommerce version: `latest` (default), `nightly` or a specific version.'
        type: string
        default: 'latest'
      php-version:
        description: 'PHP version of the test store.'
        type: string
        default: '8.4'

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_WP_VERSION: ${{ inputs.wp-version }}
      E2E_WC_VERSION: ${{ inputs.wc-version }}
      E2E_PHP_VERSION: ${{ inputs.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node version and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build the plugin
        run: npm run dev

      - name: Install the browser
        run: PLAYWRIGHT_SKIP_BROWSER_GC=1 npx playwright install chromium

      # Starts the wp-env tests site, which mounts the test-only MU plugin that
      # answers Pinterest API requests locally, so no secrets are needed.
      - name: Set up the browser test store
        run: |
          bash tests/browser/versions.sh
          npm run env:test:e2e:setup
          bash tests/browser/versions.sh check

      - name: Run E2E tests
        run: npm run env:test:e2e:run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: browser-test-results
          path: test-results/browser
          retention-days: 2
