name: PHP Coding Standards - PR Changed Files

on:
  pull_request:
    paths:
      - "**.php"
      - .github/workflows/php-cs-on-changes.yml
      - bin/lint-branch.sh
      - composer.json
      - composer.lock
      - phpcs.xml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: [7.4, 8.3]
    name: Code sniff (PHP ${{ matrix.php }}, WP Latest)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare PHP ${{ matrix.php }}
        uses: woocommerce/grow/prepare-php@b9c1e59aae9fdbe668b068ebd59c1545a88ea9fa # actions-v3.0.5
        with:
          php-version: ${{ matrix.php }}

      - name: Tool versions
        run: |
          php --version
          composer --version
          vendor/bin/phpcs-changed --version

      - name: Run PHPCS
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: composer check:php -- "$BASE_REF"
