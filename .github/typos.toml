[files]
extend-exclude = ["languages/", "*.min.js", "*.min.css", "package-lock.json", "composer.lock", "phpstan-baseline.neon", "changelog.txt", "phpcs.baseline", "phpcs*.baseline", "vendor/", "node_modules/", "build/", "assets/dist/",
    # Generated by bin/generate-categories.php; copies Google's taxonomy labels verbatim.
    "src/Product/GoogleProductTaxonomy.php",
]

[default.extend-words]
# Automattic is the correct spelling of the company name (Automattic Inc.).
Automattic = "Automattic"
# public API: translatable string in src/FeedFileOperations.php.
writeable = "writeable"
# public API: merchant-facing text in FeedStatusService::ERROR_MESSAGES.
paramaters = "paramaters"

[default.extend-identifiers]
# Base64 fixture in tests/E2e/PinterestConnectE2eTest.php.
MTQ4NjE3MzpkNWJjNTM4ZmVhMTZhYzIwMmZiNDZhMTFjMGNkZGVmNzFhOWU1YWY0 = "MTQ4NjE3MzpkNWJjNTM4ZmVhMTZhYzIwMmZiNDZhMTFjMGNkZGVmNzFhOWU1YWY0"
# GTIN: Global Trade Item Number.
GTINs = "GTINs"
